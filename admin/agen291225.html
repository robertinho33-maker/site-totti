<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Studio Totti</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Playfair+Display:wght@500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link href="../lib/animate/animate.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

    <style>
        :root { --primary-gold: #c5a059; --dark-bg: #1a1a1a; }
        .calendar { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,.08); border: 1px solid #eee; }
        .calendar-header { background: var(--bs-primary); color: #fff; padding: 25px; }
        .days-header { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; background: #fdfdfd; padding: 15px 0; border-bottom: 1px solid #eee; font-weight: 600; color: #666; }
        .calendar-body { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; background: #eee; padding: 1px; }
        .day { background: #fff; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all .2s ease; position: relative; }
        .day:hover:not(.other-month) { background: #f0f7ff; color: var(--bs-primary); }
        .day.other-month { color: #ccc; background: #fafafa; cursor: default; }
        .day.today { font-weight: 800; color: var(--bs-primary); text-decoration: underline; }
        .day.selected { background: var(--bs-primary) !important; color: #fff !important; z-index: 1; }
        .day.has-apps::after { content: ''; position: absolute; bottom: 8px; width: 6px; height: 6px; background: #ff4757; border-radius: 50%; }
        
        .slots-wrapper { max-height: 65vh; overflow-y: auto; padding-right: 10px; }
        .slot { padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 2px solid transparent; transition: all .2s ease; display: flex; align-items: center; justify-content: space-between; }
        .slot.free { background: #f8fff9; border-color: #d1e7dd; cursor: pointer; }
        .slot.free:hover { border-color: #198754; transform: scale(1.02); }
        .slot.occupied { background: #fff5f5; border-color: #f8d7da; opacity: 0.8; }
        .slot-time { font-size: 1.1rem; font-weight: 700; color: #333; }
        
        /* Mobile adjustment */
        @media (max-width: 768px) { .calendar-header h3 { font-size: 1.2rem; } .day { font-size: 0.9rem; } }
    </style>
</head>
<body>
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
        <div class="container">
            <a href="../index.html" class="navbar-brand d-flex align-items-center">
                <span class="bg-primary text-white p-2 rounded-3 me-2"><i class="bi bi-scissors"></i></span>
                <h4 class="m-0">Studio Totti 01</h4>
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto">
                    <a href="../index.html" class="nav-link">Site</a>
                    <a href="servicos-novo.html" class="nav-link">Serviços</a>
                    <a href="agenda.html" class="nav-link">Agenda</a>
                    <a href="agendamento-funcionario.html" class="nav-link active">Novo Agendamento</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid bg-primary py-5 mb-5">
        <div class="container text-center py-4">
            <h1 class="display-4 text-white animated fadeInDown">Painel de Agendamento</h1>
            <p class="text-white-50 mb-0">Gestão interna de horários e clientes</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="calendar wow fadeIn">
                    <div class="calendar-header d-flex justify-content-between align-items-center">
                        <button class="btn btn-outline-light border-0" onclick="changeMonth(-1)"><i class="bi bi-chevron-left"></i></button>
                        <h3 id="monthYear" class="mb-0 text-uppercase tracking-wider">Dezembro 2025</h3>
                        <button class="btn btn-outline-light border-0" onclick="changeMonth(1)"><i class="bi bi-chevron-right"></i></button>
                    </div>
                    <div class="days-header">
                        <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
                    </div>
                    <div class="calendar-body" id="calendarBody"></div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 sticky-top" style="top:100px;">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h5 id="selectedDayTitle" class="text-muted">Selecione uma data no calendário</h5>
                            <hr class="w-25 mx-auto">
                        </div>
                        <div id="slotsContainer" class="slots-wrapper">
                            <div class="text-center py-5">
                                <i class="bi bi-calendar-event display-1 text-light"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAgendar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white border-0">
                    <h5 class="modal-title"><i class="bi bi-clock me-2"></i>Reservar <span id="modalDateTime"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formAgendar" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Nome do Cliente</label>
                            <input type="text" class="form-control" id="clienteNome" placeholder="Ex: Maria Oliveira" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">WhatsApp</label>
                            <input type="tel" class="form-control" id="clienteWhats" placeholder="(00) 00000-0000" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Serviço</label>
                            <select class="form-select" id="servico" required>
                                <option value="" selected disabled>Escolha o serviço...</option>
                                <option>Corte Feminino</option>
                                <option>Manicure + Pedicure</option>
                                <option>Hidratação + Escova</option>
                                <option>Limpeza de Pele</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase">Profissional</label>
                            <select class="form-select" id="profissional">
                                <option>Ana (Cabelo)</option>
                                <option>Juliana (Estética)</option>
                                <option>Fernanda (Unhas)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm" id="btnSalvar">
                            CONFIRMAR AGENDAMENTO
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../lib/wow/wow.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // Configuração Firebase (Mantenha a sua original)
        const firebaseConfig = {
            apiKey: "AIzaSyC2Qa0lMl4WhjhDzNhIzWFTJsIABuSf8nc",
            authDomain: "totti-c9e6f.firebaseapp.com",
            projectId: "totti-c9e6f",
            storageBucket: "totti-c9e6f.firebasestorage.app",
            messagingSenderId: "938110274522",
            appId: "1:938110274522:web:69a16be8aa09ce7b2a0ee3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const agendamentosRef = collection(db, "agendamentos");

        // Estado Global
        let state = {
            currentMonth: new Date(),
            selectedDate: null,
            selectedTime: null,
            agendamentos: {}
        };

        const HORARIOS_PADRAO = ["09:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"];

        // Funções de UI
        function renderCalendar() {
            const year = state.currentMonth.getFullYear();
            const month = state.currentMonth.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            document.getElementById('monthYear').textContent = state.currentMonth.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

            const body = document.getElementById('calendarBody');
            body.innerHTML = '';

            // Dias vazios
            for (let i = 0; i < firstDay; i++) {
                body.insertAdjacentHTML('beforeend', '<div class="day other-month"></div>');
            }

            // Dias do mês
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasApps = Object.keys(state.agendamentos).some(k => k.startsWith(dateStr));
                const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
                const isSelected = state.selectedDate === dateStr;

                const dayEl = document.createElement('div');
                dayEl.className = `day ${hasApps ? 'has-apps' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
                dayEl.textContent = day;
                dayEl.onclick = (e) => handleDaySelection(dateStr, e);
                body.appendChild(dayEl);
            }
        }

        function handleDaySelection(dateStr, e) {
            state.selectedDate = dateStr;
            document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
            e.currentTarget.classList.add('selected');
            
            const dateObj = new Date(dateStr + 'T12:00:00'); // Evita erro de fuso
            document.getElementById('selectedDayTitle').innerHTML = `
                <span class="text-primary d-block fw-bold">${dateObj.toLocaleDateString('pt-BR', { weekday: 'long' })}</span>
                <span class="small">${dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' })}</span>
            `;
            
            renderSlots(dateStr);
        }

        function renderSlots(dateStr) {
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '';

            HORARIOS_PADRAO.forEach(hora => {
                const chave = `${dateStr} ${hora}`;
                const ag = state.agendamentos[chave];
                
                const slot = document.createElement('div');
                slot.className = `slot ${ag ? 'occupied shadow-sm' : 'free'}`;
                
                slot.innerHTML = `
                    <div class="d-flex align-items-center">
                        <div class="slot-time me-3">${hora}</div>
                        ${ag ? `<div><div class="fw-bold small">${ag.nome}</div><div class="text-muted" style="font-size:0.7rem">${ag.servico}</div></div>` : ''}
                    </div>
                    ${ag ? `<i class="bi bi-lock-fill text-danger"></i>` : `<i class="bi bi-plus-circle text-success"></i>`}
                `;

                if (!ag) {
                    slot.onclick = () => {
                        state.selectedTime = hora;
                        document.getElementById('modalDateTime').textContent = `${new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR')} às ${hora}`;
                        new bootstrap.Modal('#modalAgendar').show();
                    };
                }
                container.appendChild(slot);
            });
        }

        // Lógica do Formulário
        document.getElementById('formAgendar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            const originalText = btn.innerHTML;

            const data = {
                dataHora: `${state.selectedDate} ${state.selectedTime}`,
                data: state.selectedDate,
                hora: state.selectedTime,
                nome: document.getElementById('clienteNome').value.trim(),
                whats: document.getElementById('clienteWhats').value.trim(),
                servico: document.getElementById('servico').value,
                profissional: document.getElementById('profissional').value,
                criadoEm: new Date().toISOString()
            };

            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Gravando...';
                
                await addDoc(agendamentosRef, data);
                
                bootstrap.Modal.getInstance('#modalAgendar').hide();
                document.getElementById('formAgendar').reset();
                alert('✓ Horário reservado com sucesso!');
            } catch (err) {
                alert('Erro ao salvar agendamento.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Máscara Simples para Telefone
        document.getElementById('clienteWhats').addEventListener('input', (e) => {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        // Navegação de Meses
        window.changeMonth = (dir) => {
            state.currentMonth.setMonth(state.currentMonth.getMonth() + dir);
            renderCalendar();
        };

        // Escuta Realtime
        onSnapshot(agendamentosRef, snap => {
            state.agendamentos = {};
            snap.forEach(doc => {
                const d = doc.data();
                state.agendamentos[d.dataHora] = d;
            });
            renderCalendar();
            if (state.selectedDate) renderSlots(state.selectedDate);
            document.getElementById('spinner').classList.remove('show');
        });

        // Inicialização
        renderCalendar();
        new WOW().init();
    </script>
</body>
</html>
