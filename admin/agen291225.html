<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Studio Totti</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="../img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Playfair+Display:wght@500&family=Work+Sans&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../lib/animate/animate.min.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

    <style>
        .calendar { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
        .calendar-header { background: var(--bs-primary); color: white; padding: 20px; border-radius: 15px 15px 0 0; }
        .days-header { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; background:#f8f9fa; padding:10px; font-weight:bold; font-size:.9rem; }
        .calendar-body { display: grid; grid-template-columns: repeat(7,1fr); gap:8px; padding:20px; }
        .day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; font-weight:500; transition:.3s; }
        .day.other-month { color:#ddd; }
        .day.today { background:var(--bs-primary); color:white; font-weight:bold; }
        .day.has-slots:hover { background:#e3f2fd; }
        .day.selected { background:var(--bs-primary); color:white; box-shadow:0 0 0 3px rgba(13,110,253,.4); }
        .day.no-slots { color:#ccc; cursor:not-allowed; }
        .slot { padding:12px; margin-bottom:8px; border-radius:10px; text-align:center; font-weight:500; cursor:pointer; transition:.2s; }
        .slot.free { background:#d4edda; border:2px solid #28a745; }
        .slot.free:hover { background:#28a745; color:white; transform:translateY(-2px); }
        .slot.occupied { background:#f8d7da; color:#721c24; cursor:default; }
        .client-name { font-size:.9rem; margin-top:5px; }
    </style>
</head>
<body>
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-grow text-primary" style="width:3rem;height:3rem;"></div>
    </div>

    <!-- Navbar -->
    <div class="container-fluid bg-light sticky-top p-0">
        <nav class="navbar navbar-expand-lg navbar-light p-0">
            <a href="../index.html" class="navbar-brand bg-primary py-4 px-5 me-0">
                <h1 class="mb-0"><i class="bi bi-scissors"></i> Studio Totti</h1>
            </a>
            <button class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse p-3" id="navbarCollapse">
                <div class="navbar-nav mx-auto">
                    <a href="../index.html" class="nav-item nav-link">Site</a>
                    <a href="servicos-novo.html" class="nav-item nav-link">Cadastrar Serviço</a>
                    <a href="agenda.html" class="nav-item nav-link">Agenda Diária</a>
                    <a href="agendamento-funcionario.html" class="nav-item nav-link active">Agendar Horário</a>
                    <a href="financas.html" class="nav-item nav-link">Finanças</a>
                </div>
            </div>
        </nav>
    </div>

    <!-- Header -->
    <div class="container-fluid bg-light page-header py-5 mb-5">
        <div class="container text-center py-5">
            <h1 class="display-1 animated slideInLeft">Agendamento Interno</h1>
            <p class="lead">Marque horários para os clientes com rapidez</p>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="container pb-5">
        <div class="row g-5">
            <div class="col-lg-8">
                <div class="calendar wow fadeIn" data-wow-delay="0.2s">
                    <div class="calendar-header d-flex justify-content-between align-items-center">
                        <button class="btn btn-light btn-lg" onclick="prevMonth()">&lt;</button>
                        <h3 id="monthYear" class="mb-0"></h3>
                        <button class="btn btn-light btn-lg" onclick="nextMonth()">&gt;</button>
                    </div>
                    <div class="days-header">
                        <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                    </div>
                    <div class="calendar-body" id="calendarBody"></div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="bg-light rounded p-4 shadow sticky-top" style="top:120px;">
                    <h4 id="selectedDayTitle" class="text-primary mb-4 text-center">Selecione um dia</h4>
                    <div id="slotsContainer" style="max-height:70vh;overflow-y:auto;">
                        <p class="text-muted text-center">Clique em um dia para ver os horários</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Agendamento -->
    <div class="modal fade" id="modalAgendar" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Novo Agendamento - <span id="modalDateTime"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formAgendar">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Nome do Cliente *</label>
                                <input type="text" class="form-control form-control-lg" id="clienteNome" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">WhatsApp *</label>
                                <input type="tel" class="form-control form-control-lg" id="clienteWhats" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Serviço *</label>
                                <select class="form-select form-select-lg" id="servico" required>
                                    <option value="">Selecione...</option>
                                    <option>Corte Feminino</option>
                                    <option>Limpeza de Pele Profunda</option>
                                    <option>Manicure + Pedicure</option>
                                    <option>Massagem Modeladora</option>
                                    <option>Maquiagem para Evento</option>
                                    <option>Hidratação + Escova</option>
                                    <option>Pacote Noiva</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Profissional</label>
                                <select class="form-select form-select-lg">
                                    <option>Qualquer uma disponível</option>
                                    <option>Ana</option><option>Juliana</option><option>Fernanda</option><option>Patrícia</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Observações</label>
                                <textarea class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary btn-lg" onclick="confirmarAgendamento()">Confirmar Horário</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="container-fluid bg-dark text-white-50 py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">Studio Totti © 2025 - Sistema Interno</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../lib/wow/wow.min.js"></script>
    <script src="../js/main.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2Qa0lMl4WhjhDzNhIzWFTJsIABuSf8nc",
            authDomain: "totti-c9e6f.firebaseapp.com",
            projectId: "totti-c9e6f",
            storageBucket: "totti-c9e6f.firebasestorage.app",
            messagingSenderId: "938110274522",
            appId: "1:938110274522:web:69a16be8aa09ce7b2a0ee3",
            measurementId: "G-9HWWDZGQRN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const agendamentosRef = collection(db, "agendamentos");

        let currentMonth = new Date();
        let selectedDate = null;
        let selectedTime = null;
        let agendamentos = {};

        const horarios = ["09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00"];

        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const firstWeekday = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            document.getElementById('monthYear').textContent = currentMonth.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).replace(/^\w/, c => c.toUpperCase());

            const body = document.getElementById('calendarBody');
            body.innerHTML = '';

            for (let i = 0; i < firstWeekday; i++) body.innerHTML += '<div class="day other-month"></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const hasApps = Object.keys(agendamentos).some(k => k.startsWith(dateStr));
                const isToday = day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();

                body.innerHTML += `<div class="day ${hasApps?'has-slots':'no-slots'} ${isToday?'today':''}" onclick="selectDay('${dateStr}', event)">${day}</div>`;
            }
        }

        function selectDay(dateStr, e) {
            selectedDate = dateStr;
            document.querySelectorAll('.day.selected').forEach(d => d.classList.remove('selected'));
            e.target.classList.add('selected');
            document.getElementById('selectedDayTitle').textContent = new Date(dateStr).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
            renderSlots(dateStr);
        }

        function renderSlots(dateStr) {
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '<p class="text-muted"><strong>Horários do dia:</strong></p>';

            horarios.forEach(hora => {
                const chave = `${dateStr} ${hora}`;
                const ag = agendamentos[chave];
                const slot = document.createElement('div');
                slot.className = `slot ${ag ? 'occupied' : 'free'}`;
                slot.innerHTML = `<strong>${hora}</strong>${ag ? `<div class="client-name">${ag.nome} - ${ag.servico}</div><small>${ag.whats}</small>` : ''}`;
                if (!ag) {
                    slot.onclick = () => {
                        selectedTime = hora;
                        document.getElementById('modalDateTime').textContent = new Date(dateStr).toLocaleDateString('pt-BR') + ' às ' + hora;
                        new bootstrap.Modal(document.getElementById('modalAgendar')).show();
                    };
                }
                container.appendChild(slot);
            });
        }

        window.confirmarAgendamento = async () => {
            const nome = document.getElementById('clienteNome').value.trim();
            const whats = document.getElementById('clienteWhats').value.trim();
            const servico = document.getElementById('servico').value;
            if (!nome || !whats || !servico) return alert('Preencha os campos obrigatórios!');

            const dataHora = `${selectedDate} ${selectedTime}`;
            try {
                await addDoc(agendamentosRef, { dataHora, data: selectedDate, hora: selectedTime, nome, whats, servico, criadoEm: new Date() });
                alert(`Agendado: ${nome} às ${selectedTime}`);
                bootstrap.Modal.getInstance(document.getElementById('modalAgendar')).hide();
                document.getElementById('formAgendar').reset();
            } catch (e) {
                console.error(e);
                alert('Erro ao salvar. Veja o console.');
            }
        };

        onSnapshot(agendamentosRef, snap => {
            agendamentos = {};
            snap.forEach(doc => {
                const d = doc.data();
                agendamentos[d.dataHora] = { nome: d.nome, whats: d.whats, servico: d.servico };
            });
            renderCalendar();
            if (selectedDate) renderSlots(selectedDate);
        });

        window.prevMonth = () => { currentMonth.setMonth(currentMonth.getMonth()-1); renderCalendar(); };
        window.nextMonth = () => { currentMonth.setMonth(currentMonth.getMonth()+1); renderCalendar(); };

        renderCalendar();
    </script>
</body>
</html>
