<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC2Qa0lMl4WhjhDzNhIzWFTJsIABuSf8nc",
    authDomain: "totti-c9e6f.firebaseapp.com",
    projectId: "totti-c9e6f",
    storageBucket: "totti-c9e6f.firebasestorage.app",
    messagingSenderId: "938110274522",
    appId: "1:938110274522:web:69a16be8aa09ce7b2a0ee3",
    measurementId: "G-9HWWDZGQRN"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Coleção no Firestore chamada "agendamentos"
  const agendamentosRef = collection(db, "agendamentos");

  // Variáveis globais
  let currentMonth = new Date();
  let selectedDate = null;
  let selectedTime = null;
  let agendamentosDoDia = {}; // será preenchido em tempo real

  // Horários fixos do salão (ajuste conforme seu funcionamento)
  const horariosPadrao = [
    "09:00", "09:30", "10:00", "10:30", "11:00", "11:30",
    "12:00", "12:30", "13:00", "13:30", "14:00", "14:30",
    "15:00", "15:30", "16:00", "16:30", "17:00", "17:30",
    "18:00", "18:30", "19:00", "19:30", "20:00"
  ];

  // === FUNÇÕES DO CALENDÁRIO ===
  function renderCalendar() {
    const year = currentMonth.getFullYear();
    const month = currentMonth.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    document.getElementById('monthYear').textContent =
      currentMonth.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).replace(/^\w/, c => c.toUpperCase());

    const body = document.getElementById('calendarBody');
    body.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      body.innerHTML += '<div class="day other-month"></div>';
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const hasAppointments = Object.keys(agendamentosDoDia).some(key => key.startsWith(dateStr));
      const isToday = day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();

      body.innerHTML += `
        <div class="day ${hasAppointments ? 'has-slots' : 'no-slots'} ${isToday ? 'today' : ''}"
             onclick="selectDay('${dateStr}')">
          ${day}
        </div>`;
    }
  }

  function selectDay(dateStr) {
    selectedDate = dateStr;
    document.querySelectorAll('.day.selected').forEach(d => d.classList.remove('selected'));
    event.target.classList.add('selected');

    document.getElementById('selectedDayTitle').textContent =
      new Date(dateStr).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

    renderSlots(dateStr);
  }

  function renderSlots(dateStr) {
    const container = document.getElementById('slotsContainer');
    container.innerHTML = '<p class="text-muted"><strong>Horários do dia:</strong></p>';

    horariosPadrao.forEach(hora => {
      const chave = `${dateStr} ${hora}`;
      const agendamento = agendamentosDoDia[chave];

      const slot = document.createElement('div');
      slot.className = `slot ${agendamento ? 'occupied' : 'free'}`;
      slot.innerHTML = `
        <strong>${hora}</strong>
        ${agendamento ? `<div class="client-name">${agendamento.nome} - ${agendamento.servico}</div><small>${agendamento.whats}</small>` : ''}
      `;

      if (!agendamento) {
        slot.onclick = () => {
          selectedTime = hora;
          document.getElementById('modalDateTime').textContent = 
            new Date(dateStr).toLocaleDateString('pt-BR') + ' às ' + hora;
          new bootstrap.Modal(document.getElementById('modalAgendar')).show();
        };
      } else {
        // Botão para editar/excluir (opcional futuro)
        slot.innerHTML += `<button class="btn btn-sm btn-danger float-end" onclick="excluirAgendamento('${chave}')">✕</button>`;
      }

      container.appendChild(slot);
    });
  }

  // === SALVAR NO FIREBASE ===
  window.confirmarAgendamento = async function() {
    const nome = document.getElementById('clienteNome').value.trim();
    const whats = document.getElementById('clienteWhats').value.trim();
    const servico = document.getElementById('servico').value;
    const profissional = document.querySelector('#formAgendar select:nth-of-type(2)').value || "Qualquer uma";

    if (!nome || !whats || !servico) {
      alert('Preencha nome, WhatsApp e serviço!');
      return;
    }

    const dataHora = `${selectedDate} ${selectedTime}`;

    try {
      await addDoc(agendamentosRef, {
        dataHora: dataHora,
        data: selectedDate,
        hora: selectedTime,
        nome: nome,
        whats: whats,
        servico: servico,
        profissional: profissional,
        criadoEm: new Date()
      });

      alert(`Horário agendado com sucesso para ${nome} às ${selectedTime}!`);
      bootstrap.Modal.getInstance(document.getElementById('modalAgendar')).hide();
      document.getElementById('formAgendar').reset();
    } catch (error) {
      console.error("Erro ao salvar: ", error);
      alert("Erro ao salvar agendamento. Verifique o console.");
    }
  };

  // === ESCUTAR MUDANÇAS EM TEMPO REAL ===
  onSnapshot(agendamentosRef, (snapshot) => {
    agendamentosDoDia = {};
    snapshot.docs.forEach(doc => {
      const data = doc.data();
      agendamentosDoDia[data.dataHora] = {
        id: doc.id,
        nome: data.nome,
        whats: data.whats,
        servico: data.servico,
        profissional: data.profissional
      };
    });

    renderCalendar();
    if (selectedDate) renderSlots(selectedDate);
  });

  // Navegação de mês
  window.prevMonth = () => { currentMonth.setMonth(currentMonth.getMonth() - 1); renderCalendar(); };
  window.nextMonth = () => { currentMonth.setMonth(currentMonth.getMonth() + 1); renderCalendar(); };

  // Inicializar
  renderCalendar();
</script>
